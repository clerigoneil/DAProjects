<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Analytics Portfolio</title>
<style>
  :root{
    --bg:#0b1220; --panel:#121b2e; --panel2:#17233b; --line:#243251;
    --text:#e8edf7; --muted:#9aa8c4; --accent:#2dd4bf; --accent2:#60a5fa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* NAV */
  nav{position:sticky;top:0;z-index:50;background:rgba(11,18,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  nav .brand{font-weight:700;letter-spacing:.3px}
  nav .brand span{color:var(--accent)}
  nav ul{display:flex;gap:20px;list-style:none;font-size:.9rem}
  nav ul a{color:var(--muted)} nav ul a:hover{color:var(--text)}

  /* HERO */
  header.hero{padding:90px 0 70px;border-bottom:1px solid var(--line);
    background:radial-gradient(900px 400px at 80% -10%,rgba(45,212,191,.12),transparent),
               radial-gradient(700px 400px at 0% 0%,rgba(96,165,250,.10),transparent)}
  .hero h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;margin-bottom:14px}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero p.lead{color:var(--muted);max-width:680px;font-size:1.1rem;margin-bottom:26px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .chip{font-size:.78rem;padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel)}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-block;padding:10px 20px;border-radius:8px;font-weight:600;font-size:.92rem}
  .btn.primary{background:var(--accent);color:#06201c}
  .btn.ghost{border:1px solid var(--line);color:var(--text)}
  .btn:hover{opacity:.88}

  /* SECTIONS */
  section.block{padding:70px 0;border-bottom:1px solid var(--line)}
  .sec-title{font-size:1.7rem;margin-bottom:8px}
  .sec-sub{color:var(--muted);margin-bottom:34px}

  /* INDEX GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.2s;display:block;color:inherit}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--panel2)}
  .card .body{padding:14px 16px}
  .card h3{font-size:1rem;margin-bottom:4px}
  .card p{font-size:.85rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  /* PROJECT */
  .project{padding:70px 0;border-bottom:1px solid var(--line)}
  .project:nth-child(even){background:rgba(255,255,255,.015)}
  .p-head{margin-bottom:30px}
  .p-num{color:var(--accent);font-weight:700;font-size:.85rem;letter-spacing:2px;text-transform:uppercase}
  .p-head h2{font-size:1.9rem;margin:4px 0 8px}
  .p-head .tagline{color:var(--muted);max-width:760px}
  .award{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:10px 16px;border-radius:10px;border:1px solid rgba(251,191,36,.45);background:linear-gradient(90deg,rgba(251,191,36,.18),rgba(251,191,36,.05));color:#fde68a;font-weight:600;font-size:.95rem}
  .award .trophy{font-size:1.3rem;line-height:1}
  .card .award-tag{display:inline-block;margin-top:8px;font-size:.74rem;font-weight:600;color:#fde68a;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.4);border-radius:999px;padding:2px 10px}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .tools .chip{color:var(--accent2);border-color:rgba(96,165,250,.35)}

  .p-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
  @media(max-width:900px){.p-grid{grid-template-columns:1fr}nav ul{display:none}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:18px}
  .box h4{font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .box p{color:#cfd8ea;font-size:.96rem}
  .box ul{padding-left:18px;color:#cfd8ea;font-size:.95rem}
  .box li{margin-bottom:6px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
  .kpi b{display:block;font-size:1.4rem;color:var(--accent)}
  .kpi span{font-size:.78rem;color:var(--muted)}

  video{width:100%;border-radius:12px;border:1px solid var(--line);background:#000;display:block}
  .vlabel{font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
  .shots img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--panel2);transition:.2s}
  .shots img:hover{border-color:var(--accent)}
  .main-shot{width:100%;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;margin-bottom:18px;display:block;background:var(--panel2)}

  /* ABOUT / CONTACT */
  .about{display:grid;grid-template-columns:2fr 1fr;gap:34px}
  @media(max-width:900px){.about{grid-template-columns:1fr}}
  .about p{color:#cfd8ea;margin-bottom:12px}
  .skills .row{margin-bottom:12px}
  .skills .row label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:4px}
  .bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

  footer{padding:40px 0;text-align:center;color:var(--muted);font-size:.85rem}

  /* LIGHTBOX */
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;padding:24px}
  #lightbox.open{display:flex}
  #lightbox img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>

<script>
// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450'><rect width='100%' height='100%' fill='#17233b'/><text x='50%' y='50%' fill='#9aa8c4' font-family='Arial' font-size='22' text-anchor='middle'>Add screenshot path</text></svg>`);
const imgTag = (src, cls = "", extra = "") =>
  `<img ${cls ? `class="${cls}"` : ""} src="${esc(src)}" loading="lazy" ${extra} onerror="this.onerror=null;this.src='${PLACEHOLDER}'">`;

// ---------- Profile ----------
document.title = `${PROFILE.name} | Data Analytics Portfolio`;
$("navBrand").innerHTML = `${esc(PROFILE.name.split(" ")[0])}<span>.</span>${esc(PROFILE.name.split(" ").slice(1).join(" "))}`;
$("heroTitle").textContent = PROFILE.title;
$("heroHeadline").textContent = PROFILE.headline;
$("heroIntro").textContent = PROFILE.intro;
$("heroSkills").innerHTML = PROFILE.skills.map(s => `<span class="chip">${esc(s)}</span>`).join("");
$("aboutText").innerHTML = PROFILE.about.map(p => `<p>${esc(p)}</p>`).join("");
$("skillBars").innerHTML = PROFILE.skillLevels.map(([n, v]) =>
  `<div class="row"><label><span>${esc(n)}</span><span>${v}%</span></label><div class="bar"><i style="width:${v}%"></i></div></div>`).join("");
$("contactBtns").innerHTML =
  (PROFILE.email ? `<a class="btn primary" href="mailto:${esc(PROFILE.email)}">Email Me</a>` : "clerigonoriel@gmail.com") +
  (PROFILE.linkedin ? `<a class="btn ghost" href="${esc(PROFILE.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : "") +
  (PROFILE.github ? `<a class="btn ghost" href="${esc(PROFILE.github)}" target="_blank" rel="noopener">GitHub</a>` : "") +
  (PROFILE.cv ? `<a class="btn ghost" href="${esc(PROFILE.cv)}" target="_blank" rel="noopener">Download CV</a>` : "");
$("footer").textContent = `© ${new Date().getFullYear()} ${PROFILE.name}. All rights reserved.`;

// ---------- Project grid ----------
$("projectGrid").innerHTML = PROJECTS.map((p, i) => `
  <a class="card" href="#${esc(p.id)}">
    ${imgTag(p.cover || (p.screenshots && p.screenshots[0]) || "")}
    <div class="body"><h3>${String(i + 1).padStart(2, "0")} · ${esc(p.title)}</h3><p>${esc(p.tagline)}</p>${p.award ? `<span class="award-tag">🏆 ${esc(p.award)}</span>` : ""}</div>
  </a>`).join("");

// ---------- Project sections ----------
$("projectList").innerHTML = PROJECTS.map((p, i) => {
  const shots = p.screenshots || [];
  const main = shots[0];
  const rest = shots.slice(1);
  return `
  <section class="project" id="${esc(p.id)}">
    <div class="wrap">
      <div class="p-head">
        <div class="p-num">Project ${String(i + 1).padStart(2, "0")}</div>
        <h2>${esc(p.title)}</h2>
        <p class="tagline">${esc(p.tagline)}</p>
           ${p.award ? `<div class="award"><span class="trophy">🏆</span><span>${esc(p.award)}</span></div>` : ""}
        <div class="tools">${(p.tools || []).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      </div>

      <div class="p-grid">
        <div>
          ${p.kpis && p.kpis.length ? `<div class="kpis">${p.kpis.map(k => `<div class="kpi"><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join("")}</div>` : ""}
          <div class="box"><h4>Business Problem</h4><p>${esc(p.problem)}</p></div>
          <div class="box"><h4>Key Question Addressed</h4><p>${esc(p.narrative)}</p></div>
          ${p.insights && p.insights.length ? `<div class="box"><h4>Dashboard Outcome and Features</h4><ul>${p.insights.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
		  </div>

        <div>
          ${main ? imgTag(main, "main-shot", `data-zoom="1"`) : ""}
          ${p.video ? `
            <p class="vlabel">Dashboard Walkthrough</p>
            <video controls preload="metadata" ${p.videoPoster ? `poster="${esc(p.videoPoster)}"` : ""}>
              <source src="${esc(p.video)}" type="video/mp4">
              Your browser does not support the video tag.
            </video>` : ""}
          ${rest.length ? `<div class="shots">${rest.map(s => imgTag(s, "", `data-zoom="1"`)).join("")}</div>` : ""}
        </div>
      </div>
    </div>
  </section>`;
}).join("");

// ---------- Lightbox ----------
const lb = $("lightbox"), lbImg = lb.querySelector("img");
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.matches && t.matches("img[data-zoom]") && t.src !== PLACEHOLDER) {
    lbImg.src = t.src; lb.classList.add("open");
  } else if (lb.classList.contains("open")) {
    lb.classList.remove("open");
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") lb.classList.remove("open"); });
</script>
</body>
</html>
